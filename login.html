<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | ยืม-คืนอุปกรณ์ไอที</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { prompt: ['Prompt', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
                }
            }
        }
    </script>
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <div class="sm:mx-auto sm:w-full sm:max-w-md px-4">
        <!-- โลโก้และหัวข้อ -->
        <div class="flex justify-center">
            <div class="w-14 h-14 rounded-2xl bg-brand-600 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                <i class="fa-solid fa-laptop-code text-2xl"></i>
            </div>
        </div>
        <h2 class="mt-6 text-center text-2xl sm:text-3xl font-bold text-slate-900">
            เข้าสู่ระบบ
        </h2>
        <p class="mt-2 text-center text-sm text-slate-600">
            เพื่อจองและจัดการอุปกรณ์ไอทีของสถาบัน[cite: 1]
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4">
        <div class="bg-white py-8 px-4 sm:px-10 shadow-xl shadow-slate-200/50 rounded-2xl border border-slate-100 relative overflow-hidden">
            
            <!-- กล่องแจ้งเตือน (ซ่อนไว้ก่อน) -->
            <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm flex items-start gap-3">
                <i id="alertIcon" class="fa-solid mt-0.5"></i>
                <div id="alertMessage" class="flex-1 leading-relaxed"></div>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                <!-- อีเมล -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700">อีเมลสถาบัน</label>
                    <div class="mt-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <input id="email" type="email" required placeholder="เช่น somchai@vocational.ac.th"
                            class="appearance-none block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm transition-colors">
                    </div>
                </div>

                <!-- รหัสผ่าน -->
                <div>
                    <div class="flex items-center justify-between">
                        <label for="password" class="block text-sm font-medium text-slate-700">รหัสผ่าน</label>
                        <a href="#" onclick="alert('เดี๋ยวเราจะมีหน้ารีเซ็ตรหัสผ่านให้เร็วๆ นี้นะครับ')" class="text-sm font-medium text-brand-600 hover:text-brand-500">
                            ลืมรหัสผ่านใช่ไหม?
                        </a>
                    </div>
                    <div class="mt-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input id="password" type="password" required placeholder="รหัสผ่านของคุณ"
                            class="appearance-none block w-full pl-10 pr-10 py-2.5 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm transition-colors">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                            <i id="eyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- ปุ่มเข้าสู่ระบบ -->
                <div>
                    <button type="submit" id="submitBtn"
                        class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors">
                        <span id="btnText">เข้าสู่ระบบ</span>
                        <i id="btnSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-slate-600">
                    ยังไม่มีบัญชีใช่ไหม? <a href="register.html" class="font-medium text-brand-600 hover:text-brand-500">สมัครใช้งานที่นี่</a>
                </p>
                <div class="mt-4">
                    <a href="index.html" class="text-xs text-slate-400 hover:text-slate-600"><i class="fa-solid fa-arrow-left mr-1"></i> กลับหน้าหลัก</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api'; // เปลี่ยนเป็น Render URL ตอน Deploy จริง

        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        function showAlert(type, msg) {
            const box = document.getElementById('alertBox');
            const icon = document.getElementById('alertIcon');
            const msgEl = document.getElementById('alertMessage');
            
            box.className = 'mb-6 p-4 rounded-xl text-sm flex items-start gap-3';
            if(type === 'error') {
                box.classList.add('bg-red-50', 'text-red-800', 'border', 'border-red-200');
                icon.className = 'fa-solid fa-circle-exclamation mt-0.5 text-red-500 text-lg';
            } else if (type === 'warning') {
                box.classList.add('bg-amber-50', 'text-amber-800', 'border', 'border-amber-200');
                icon.className = 'fa-solid fa-triangle-exclamation mt-0.5 text-amber-500 text-lg';
            } else {
                box.classList.add('bg-green-50', 'text-green-800', 'border', 'border-green-200');
                icon.className = 'fa-solid fa-circle-check mt-0.5 text-green-500 text-lg';
            }
            msgEl.innerHTML = msg;
            box.classList.remove('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('btnSpinner');
            const text = document.getElementById('btnText');
            
            btn.disabled = true;
            spinner.classList.remove('hidden');
            text.textContent = 'กำลังตรวจสอบ...';
            document.getElementById('alertBox').classList.add('hidden');

            try {
                // จำลองการต่อ API จริง (จะใช้ fetch ไปที่ Django)
                const email = document.getElementById('email').value;
                
                // --- Mock API Delay ---
                await new Promise(r => setTimeout(r, 1000));
                
                // จำลองสถานะพักสิทธิ์[cite: 1]
                if(email.includes('suspend')) {
                    showAlert('warning', '<strong>บัญชีของคุณถูกพักสิทธิ์ชั่วคราว</strong><br>เนื่องจากคืนอุปกรณ์เกินกำหนด จะจองใหม่ได้อีกครั้งในวันพรุ่งนี้ครับ');
                } else if(email.includes('error')) {
                    showAlert('error', 'อีเมลหรือรหัสผ่านไม่ถูกต้อง ลองตรวจสอบดูอีกครั้งนะครับ');
                } else {
                    showAlert('success', 'เข้าสู่ระบบสำเร็จ! กำลังพาไปที่หน้าหลัก...');
                    setTimeout(() => {
                        window.location.href = email.includes('staff') ? 'staff/dashboard.html' : 'student/catalog.html';
                    }, 1500);
                }

            } catch (error) {
                showAlert('error', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ครับ รบกวนลองใหม่ทีหลังนะ');
            } finally {
                if(!document.getElementById('alertBox').classList.contains('bg-green-50')){
                    btn.disabled = false;
                    spinner.classList.add('hidden');
                    text.textContent = 'เข้าสู่ระบบ';
                }
            }
        }
    </script>
</body>
</html>
