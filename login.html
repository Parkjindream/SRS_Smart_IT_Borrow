<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - IT Borrow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-[#0f172a] min-h-screen flex flex-col">

    <!-- Navbar สีขาว (อิงจากภาพ index.html) -->
    <nav class="bg-white px-8 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <i class="fas fa-desktop"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-900 leading-tight">IT Borrow</h1>
                <p class="text-[10px] text-gray-500">ระบบยืม-คืนอุปกรณ์ไอที</p>
            </div>
        </div>
        
        <div class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-600">
            <a href="index.html" class="hover:text-blue-600 transition">หน้าแรก</a>
            <a href="#" class="hover:text-blue-600 transition">รายการอุปกรณ์</a>
            <a href="#" class="hover:text-blue-600 transition">ขั้นตอนการยืม</a>
            <a href="#" class="hover:text-blue-600 transition">ระเบียบการยืม</a>
        </div>

        <div class="flex gap-3">
            <a href="login.html" class="px-5 py-2 text-blue-600 text-sm font-medium hover:bg-blue-50 rounded-full transition">เข้าสู่ระบบ</a>
            <a href="register.html" class="px-5 py-2 bg-blue-600 text-white text-sm font-medium rounded-full hover:bg-blue-700 transition">ลงทะเบียน</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-6 relative">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 relative z-10">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-900">เข้าสู่ระบบ</h2>
                <p class="text-gray-500 text-sm mt-1">ใช้อีเมลสถาบันเพื่อเข้าสู่ระบบ (นักศึกษา / เจ้าหน้าที่)</p>
            </div>

            <form id="loginForm" class="space-y-5" onsubmit="executeLogin(event)">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">อีเมลสถาบัน</label>
                    <input type="email" id="email" required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition"
                        placeholder="เช่น 68030311@kmtil.ac.th">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-semibold text-gray-700">รหัสผ่าน</label>
                        <a href="#" class="text-xs text-blue-600 hover:underline">ลืมรหัสผ่าน?</a>
                    </div>
                    <input type="password" id="password" required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition"
                        placeholder="••••••••">
                </div>

                <!-- Alert Message -->
                <div id="alertBox" class="hidden p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm flex items-center gap-2">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="alertText">อีเมลหรือรหัสผ่านไม่ถูกต้อง</span>
                </div>

                <button type="submit" 
                    class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-blue-600/30 flex justify-center items-center gap-2">
                    <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </main>

   <script>
    async function executeLogin(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const alertBox = document.getElementById('alertBox');
        const alertText = document.getElementById('alertText');

        try {
            const response = await fetch('http://127.0.0.1:8000/api/login/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ email: email, password: password })
            });
            
            const data = await response.json();

            if (response.ok && data.success) {
                // บันทึกสถานะลงใน Browser
                localStorage.setItem('userEmail', data.email);
                localStorage.setItem('isStaff', data.is_staff);

                // แยกหน้าอัตโนมัติ: ถ้าเป็นแอดมิน (is_staff = True) ไปหลังบ้าน, นักศึกษาไปหน้าแรก
                if (data.is_staff) {
                    window.location.href = 'admin_dashboard.html';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                alertText.textContent = data.message || "การเข้าสู่ระบบล้มเหลว";
                alertBox.classList.remove('hidden');
            }
        } catch (err) {
            console.error(err);
            alertText.textContent = "ไม่สามารถเชื่อมต่อ Django API ได้ (โปรดตรวจสอบการรันเซิร์ฟเวอร์)";
            alertBox.classList.remove('hidden');
        }
    }
</script>
</body>
</html>
