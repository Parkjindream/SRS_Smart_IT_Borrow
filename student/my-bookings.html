<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การจองของฉัน | ยืม-คืนอุปกรณ์ไอที</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- นำเข้าไลบรารีสร้าง QR Code ชั่วคราว -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { prompt: ['Prompt', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
                }
            }
        }
    </script>
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white">
                    <i class="fa-solid fa-laptop-code text-sm"></i>
                </div>
                <span class="font-bold text-slate-800 text-lg hidden sm:block">IT Borrow</span>
            </div>
            
            <div class="flex items-center gap-4 sm:gap-6">
                <a href="catalog.html" class="text-sm font-medium text-slate-600 hover:text-brand-600 transition">
                    <i class="fa-solid fa-plus mr-1"></i> จองอุปกรณ์
                </a>
                <div class="h-5 w-px bg-slate-300"></div>
                <button onclick="handleLogout()" class="text-sm font-medium text-rose-500 hover:text-rose-600 transition">
                    ออกจากระบบ
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-slate-900">การจองของฉัน</h1>
            <p class="text-sm text-slate-500 mt-1">จัดการรายการยืม-คืน และแสดง QR Code ให้เจ้าหน้าที่</p>
        </div>

        <!-- ตัวกรองสถานะ (Tabs) -->
        <div class="flex gap-4 border-b border-slate-200 mb-6 overflow-x-auto">
            <button onclick="filterBookings('active')" id="tab-active" class="pb-3 text-sm font-medium border-b-2 border-brand-600 text-brand-600 whitespace-nowrap transition-colors">
                กำลังดำเนินการ / กำลังยืม
            </button>
            <button onclick="filterBookings('history')" id="tab-history" class="pb-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap transition-colors">
                ประวัติการทำรายการ
            </button>
        </div>

        <!-- รายการจอง -->
        <div id="bookingList" class="space-y-4">
            <!-- จะถูกเรนเดอร์ผ่าน JS -->
        </div>

    </main>

    <!-- Modal QR Code -->
    <div id="qrModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300" id="qrModalContent">
            <div class="p-6 text-center relative">
                <button onclick="closeQrModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
                
                <h3 class="font-bold text-lg text-slate-900 mb-1">สแกนเพื่อรับ/คืนอุปกรณ์</h3>
                <p id="qrRefNumber" class="text-xs text-brand-600 font-medium mb-6 uppercase"></p>
                
                <div class="flex justify-center p-4 bg-white border border-slate-100 rounded-xl shadow-sm inline-block mx-auto mb-4">
                    <div id="qrcode"></div>
                </div>
                
                <p id="qrItemName" class="text-sm font-bold text-slate-800 mb-1"></p>
                <p id="qrDateText" class="text-xs text-slate-500"></p>
            </div>
            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100">
                <button onclick="closeQrModal()" class="w-full py-2.5 rounded-xl bg-slate-200 text-slate-700 font-medium text-sm hover:bg-slate-300 transition">
                    ปิดหน้าต่าง
                </button>
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลจำลอง (Mock Data) รอต่อ API จาก Django
        const mockBookings = [
            { id: "BKG-1045", itemId: 1, itemName: "MacBook Pro 14 (M2)", image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=600", startDate: "2023-11-01", endDate: "2023-11-07", status: "pending" }, // รอรับของ
            { id: "BKG-0982", itemId: 2, itemName: "iPad Air 5 + Pencil", image: "https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?q=80&w=600", startDate: "2023-10-25", endDate: "2023-10-31", status: "borrowed" }, // กำลังยืม
            { id: "BKG-0911", itemId: 3, itemName: "Dell Latitude 15", image: "https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?q=80&w=600", startDate: "2023-10-10", endDate: "2023-10-15", status: "overdue" }, // เลยกำหนด
            { id: "BKG-0850", itemId: 4, itemName: "Wacom Intuos Pro", image: "https://images.unsplash.com/photo-1581451001429-17ce38186175?q=80&w=600", startDate: "2023-09-01", endDate: "2023-09-05", status: "returned" }, // คืนแล้ว
        ];

        let currentTab = 'active';

        function getStatusConfig(status) {
            switch(status) {
                case 'pending': return { color: 'bg-amber-100 text-amber-700 border-amber-200', text: 'รอรับอุปกรณ์', icon: 'fa-clock' };
                case 'borrowed': return { color: 'bg-blue-100 text-blue-700 border-blue-200', text: 'กำลังยืม', icon: 'fa-hand-holding-hand' };
                case 'overdue': return { color: 'bg-rose-100 text-rose-700 border-rose-200', text: 'เลยกำหนดคืน', icon: 'fa-triangle-exclamation' };
                case 'returned': return { color: 'bg-slate-100 text-slate-600 border-slate-200', text: 'คืนแล้ว', icon: 'fa-check' };
                default: return { color: 'bg-slate-100 text-slate-600 border-slate-200', text: 'ไม่ทราบสถานะ', icon: 'fa-circle-info' };
            }
        }

        function filterBookings(type) {
            currentTab = type;
            
            // อัปเดต UI ของ Tab
            document.getElementById('tab-active').className = type === 'active' 
                ? 'pb-3 text-sm font-medium border-b-2 border-brand-600 text-brand-600 whitespace-nowrap transition-colors'
                : 'pb-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap transition-colors';
            
            document.getElementById('tab-history').className = type === 'history' 
                ? 'pb-3 text-sm font-medium border-b-2 border-brand-600 text-brand-600 whitespace-nowrap transition-colors'
                : 'pb-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap transition-colors';

            renderBookings();
        }

        function renderBookings() {
            const list = document.getElementById('bookingList');
            list.innerHTML = '';

            const filtered = mockBookings.filter(b => {
                if(currentTab === 'active') return ['pending', 'borrowed', 'overdue'].includes(b.status);
                return b.status === 'returned';
            });

            if(filtered.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-200">
                        <i class="fa-solid fa-box-open text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500 text-sm">ไม่มีรายการในหมวดหมู่นี้</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(b => {
                const conf = getStatusConfig(b.status);
                // แสดงปุ่ม QR Code เฉพาะรายการที่ยังไม่จบกระบวนการ
                const showQrBtn = ['pending', 'borrowed'].includes(b.status);

                const cardHTML = `
                    <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 flex flex-col sm:flex-row gap-5 items-start sm:items-center hover:shadow-md transition-shadow">
                        <div class="w-full sm:w-24 h-48 sm:h-24 rounded-xl bg-slate-100 overflow-hidden shrink-0">
                            <img src="${b.image}" alt="${b.itemName}" class="w-full h-full object-cover">
                        </div>
                        
                        <div class="flex-1 space-y-1 w-full">
                            <div class="flex justify-between items-start gap-2">
                                <h3 class="font-bold text-slate-800 text-lg line-clamp-1">${b.itemName}</h3>
                                <span class="px-2.5 py-1 text-xs font-medium rounded-md border ${conf.color} whitespace-nowrap">
                                    <i class="fa-solid ${conf.icon} mr-1"></i> ${conf.text}
                                </span>
                            </div>
                            <p class="text-xs text-slate-500 font-mono">Ref: ${b.id}</p>
                            <p class="text-sm text-slate-600 pt-2"><i class="fa-regular fa-calendar text-slate-400 mr-1"></i> ยืม: ${b.startDate} <i class="fa-solid fa-arrow-right mx-1 text-slate-300"></i> คืน: ${b.endDate}</p>
                        </div>

                        ${showQrBtn ? `
                        <div class="w-full sm:w-auto pt-4 sm:pt-0 border-t border-slate-100 sm:border-0">
                            <button onclick="openQrModal('${b.id}')" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-slate-900 text-white font-medium text-sm hover:bg-brand-600 transition shadow-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-qrcode"></i> แสดง QR Code
                            </button>
                        </div>
                        ` : ''}
                    </div>
                `;
                list.innerHTML += cardHTML;
            });
        }

        // ระบบ Modal สำหรับ QR Code
        const qrModal = document.getElementById('qrModal');
        const qrModalContent = document.getElementById('qrModalContent');
        let qrcodeObj = null;

        function openQrModal(bookingId) {
            const b = mockBookings.find(x => x.id === bookingId);
            if(!b) return;

            document.getElementById('qrRefNumber').textContent = `รหัสอ้างอิง: ${b.id}`;
            document.getElementById('qrItemName').textContent = b.itemName;
            document.getElementById('qrDateText').textContent = `วันที่คืน: ${b.endDate}`;

            // สร้าง QR Code จาก ID
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            qrcodeObj = new QRCode(qrContainer, {
                text: b.id,
                width: 160,
                height: 160,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            qrModal.classList.remove('hidden');
            setTimeout(() => {
                qrModal.classList.remove('opacity-0');
                qrModalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeQrModal() {
            qrModal.classList.add('opacity-0');
            qrModalContent.classList.add('scale-95');
            setTimeout(() => {
                qrModal.classList.add('hidden');
            }, 300);
        }

        function handleLogout() {
            if(confirm('ต้องการออกจากระบบใช่หรือไม่?')) {
                window.location.href = '../login.html';
            }
        }

        window.onload = renderBookings;
    </script>
</body>
</html>
