<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการอุปกรณ์ | ยืม-คืนอุปกรณ์ไอที</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { prompt: ['Prompt', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
                }
            }
        }
    </script>
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white">
                    <i class="fa-solid fa-laptop-code text-sm"></i>
                </div>
                <span class="font-bold text-slate-800 text-lg hidden sm:block">IT Borrow</span>
            </div>
            
            <div class="flex items-center gap-4 sm:gap-6">
                <a href="my-bookings.html" class="text-sm font-medium text-slate-600 hover:text-brand-600 transition">
                    <i class="fa-solid fa-list-check mr-1"></i> การจองของฉัน
                </a>
                <div class="h-5 w-px bg-slate-300"></div>
                <button onclick="handleLogout()" class="text-sm font-medium text-rose-500 hover:text-rose-600 transition">
                    ออกจากระบบ
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- Header & Filter -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">ยืมอุปกรณ์ไอที</h1>
                <p class="text-sm text-slate-500 mt-1">เลือกอุปกรณ์ที่คุณต้องการจองล่วงหน้า (ยืมได้สูงสุด 7 วัน)</p>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="ค้นหาชื่ออุปกรณ์..." class="pl-9 pr-4 py-2 w-full sm:w-64 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
                </div>
                <select id="categoryFilter" class="px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm bg-white cursor-pointer">
                    <option value="all">ทุกหมวดหมู่</option>
                    <option value="laptop">โน้ตบุ๊ก</option>
                    <option value="tablet">แท็บเล็ต</option>
                    <option value="accessory">อุปกรณ์เสริม</option>
                </select>
            </div>
        </div>

        <!-- Equipment Grid Container -->
        <div id="equipmentGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- จะถูกเรนเดอร์ผ่าน JavaScript (จำลองมาจาก API) -->
        </div>

    </main>

    <!-- Modal จองอุปกรณ์ -->
    <div id="bookingModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
            
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg text-slate-900">ระบุรายละเอียดการจอง</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-6 space-y-5">
                <!-- Item Info -->
                <div class="flex items-center gap-4 bg-brand-50 p-3 rounded-xl border border-brand-100">
                    <div class="w-16 h-16 rounded-lg bg-white overflow-hidden shrink-0">
                        <img id="modalImg" src="" alt="item" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <p id="modalItemName" class="font-bold text-slate-800 text-sm"></p>
                        <p class="text-xs text-brand-600 font-medium mt-1">
                            <i class="fa-solid fa-boxes-stacked"></i> สต็อกพร้อมยืม: <span id="modalStock"></span> ชิ้น
                        </p>
                    </div>
                </div>

                <!-- Date Picker -->
                <form id="bookingForm" onsubmit="submitBooking(event)" class="space-y-4">
                    <input type="hidden" id="modalItemId">
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">วันที่ต้องการรับของ</label>
                        <input type="date" id="startDate" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">วันที่คาดว่าจะคืน (สูงสุด 7 วัน)</label>
                        <input type="date" id="endDate" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
                    </div>

                    <!-- Alert / Error (ถ้ามี) -->
                    <div id="modalAlert" class="hidden text-xs p-3 rounded-lg bg-rose-50 text-rose-600 border border-rose-200 flex items-start gap-2">
                        <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
                        <span id="modalAlertText"></span>
                    </div>

                    <!-- Action Buttons -->
                    <div class="pt-4 flex gap-3">
                        <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium text-sm hover:bg-slate-50 transition">
                            ยกเลิก
                        </button>
                        <button type="submit" id="confirmBtn" class="flex-1 px-4 py-2.5 rounded-xl bg-brand-600 text-white font-medium text-sm hover:bg-brand-700 transition flex items-center justify-center gap-2">
                            <span id="confirmBtnText">ยืนยันการจอง</span>
                            <i id="confirmSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // ข้อมูลจำลอง (Mock Data) รอต่อ API จาก Django
        const mockEquipments = [
            { id: 1, name: "MacBook Pro 14 (M2)", category: "laptop", image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=600", stock: 2, total: 5, desc: "สำหรับงานประมวลผลสูง ตัดต่อ และเขียนโค้ด" },
            { id: 2, name: "iPad Air 5 + Pencil", category: "tablet", image: "https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?q=80&w=600", stock: 0, total: 8, desc: "เหมาะสำหรับจดเลกเชอร์และนำเสนองาน" },
            { id: 3, name: "Dell Latitude 15", category: "laptop", image: "https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?q=80&w=600", stock: 5, total: 10, desc: "โน้ตบุ๊ก Windows สำหรับพิมพ์งานและใช้งานทั่วไป" },
            { id: 4, name: "Wacom Intuos Pro", category: "accessory", image: "https://images.unsplash.com/photo-1581451001429-17ce38186175?q=80&w=600", stock: 1, total: 3, desc: "เมาส์ปากกาสำหรับนักศึกษาออกแบบกราฟิก" },
        ];

        // ฟังก์ชันเรนเดอร์รายการอุปกรณ์ลงหน้าเว็บ
        function renderEquipments() {
            const grid = document.getElementById('equipmentGrid');
            grid.innerHTML = '';

            mockEquipments.forEach(item => {
                // เช็กสต็อก
                const isOutOfStock = item.stock === 0;
                const statusBadge = isOutOfStock 
                    ? `<div class="absolute top-3 right-3 px-3 py-1 bg-rose-500/90 backdrop-blur text-white text-xs font-bold rounded-full">ของหมด (0/${item.total})</div>`
                    : `<div class="absolute top-3 right-3 px-3 py-1 bg-emerald-500/90 backdrop-blur text-white text-xs font-bold rounded-full">เหลือ ${item.stock}/${item.total}</div>`;

                const btnClass = isOutOfStock 
                    ? `bg-slate-100 text-slate-400 cursor-not-allowed` 
                    : `bg-slate-900 text-white hover:bg-brand-600 shadow-sm`;

                const btnText = isOutOfStock ? 'ของหมดชั่วคราว' : 'จองอุปกรณ์นี้';

                const cardHTML = `
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden hover:shadow-xl transition-shadow duration-300 flex flex-col">
                        <div class="relative h-48 bg-slate-100">
                            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover ${isOutOfStock ? 'grayscale opacity-70' : ''}">
                            ${statusBadge}
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800">${item.name}</h3>
                                <p class="text-xs text-slate-500 mt-1 leading-relaxed">${item.desc}</p>
                            </div>
                            <button ${isOutOfStock ? 'disabled' : `onclick="openModal(${item.id})"`} 
                                class="w-full py-2.5 rounded-xl font-medium text-sm transition text-center ${btnClass}">
                                ${btnText}
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // ระบบ Modal สำหรับการจอง
        const modal = document.getElementById('bookingModal');
        const modalContent = document.getElementById('modalContent');
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');

        function openModal(itemId) {
            const item = mockEquipments.find(e => e.id === itemId);
            if(!item) return;

            document.getElementById('modalItemId').value = item.id;
            document.getElementById('modalItemName').textContent = item.name;
            document.getElementById('modalStock').textContent = item.stock;
            document.getElementById('modalImg').src = item.image;
            document.getElementById('modalAlert').classList.add('hidden');

            // Set ค่า default วันที่ (วันนี้ ถึง พรุ่งนี้)
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            startDateInput.value = today.toISOString().split('T')[0];
            startDateInput.min = today.toISOString().split('T')[0];
            
            endDateInput.value = tomorrow.toISOString().split('T')[0];
            endDateInput.min = today.toISOString().split('T')[0];

            modal.classList.remove('hidden');
            // Timeout สำหรับ Animation เปิด Modal
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // ตรวจสอบเงื่อนไขวันยืมคืนและจำลองการ Submit API
        async function submitBooking(e) {
            e.preventDefault();
            const start = new Date(startDateInput.value);
            const end = new Date(endDateInput.value);
            const alertBox = document.getElementById('modalAlert');
            const alertText = document.getElementById('modalAlertText');

            // ตรวจสอบจำนวนวัน (สูงสุด 7 วัน)
            const diffTime = Math.abs(end - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
            
            if (end < start) {
                alertText.textContent = "วันคืนอุปกรณ์ต้องอยู่หลังวันยืมครับ";
                alertBox.classList.remove('hidden');
                return;
            }
            if (diffDays > 7) {
                alertText.textContent = "สามารถยืมได้สูงสุดไม่เกิน 7 วันต่อครั้งครับ";
                alertBox.classList.remove('hidden');
                return;
            }

            // จำลองปุ่มโหลด (รอต่อ API สร้าง Booking และลดจำนวนคงเหลือ)
            const btn = document.getElementById('confirmBtn');
            const text = document.getElementById('confirmBtnText');
            const spinner = document.getElementById('confirmSpinner');
            
            btn.disabled = true;
            text.textContent = "กำลังทำรายการ...";
            spinner.classList.remove('hidden');
            alertBox.classList.add('hidden');

            try {
                // จำลองดีเลย์รอ Server
                await new Promise(r => setTimeout(r, 1000));
                
                alert('จองสำเร็จ! ระบบได้สร้าง QR Code และส่งอีเมลยืนยันให้คุณแล้วครับ');
                closeModal();
                // นำทางไปหน้า "การจองของฉัน" (ในอนาคต)
                // window.location.href = 'my-bookings.html';
                
            } catch (error) {
                alertText.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์";
                alertBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                text.textContent = "ยืนยันการจอง";
                spinner.classList.add('hidden');
            }
        }

        function handleLogout() {
            if(confirm('ต้องการออกจากระบบใช่หรือไม่?')) {
                window.location.href = '../login.html';
            }
        }

        // โหลดข้อมูลครั้งแรก
        window.onload = renderEquipments;
    </script>
</body>
</html>
