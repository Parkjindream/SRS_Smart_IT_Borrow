<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนนักศึกษา - ระบบยืม-คืนอุปกรณ์ไอที</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="w-full max-w-md relative z-10 py-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white tracking-wide">ลงทะเบียนสิทธิ์ใช้งาน</h1>
            <p class="text-slate-400 text-sm mt-1">สำหรับนักศึกษาภายในสถาบันเท่านั้น</p>
        </div>

        <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/50 rounded-3xl p-8 shadow-2xl">
            <form id="registerForm" class="space-y-4" onsubmit="handleRegister(event)">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">ชื่อจริง</label>
                        <input type="text" id="firstName" required class="w-full px-3.5 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl text-white text-sm focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">นามสกุล</label>
                        <input type="text" id="lastName" required class="w-full px-3.5 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl text-white text-sm focus:border-blue-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">รหัสนักศึกษา</label>
                    <input type="text" id="studentId" placeholder="เช่น 65012345" required class="w-full px-3.5 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl text-white text-sm focus:border-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">อีเมลสถาบัน (@university.ac.th)</label>
                    <input type="email" id="regEmail" placeholder="student@university.ac.th" required class="w-full px-3.5 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl text-white text-sm focus:border-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">กำหนดรหัสผ่าน</label>
                    <input type="password" id="regPassword" placeholder="ความยาวอย่างน้อย 8 ตัวอักษร" required class="w-full px-3.5 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl text-white text-sm focus:border-blue-500 focus:outline-none">
                </div>

                <div id="regAlert" class="hidden p-3 rounded-xl text-xs"></div>

                <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-blue-600/30 mt-2">
                    ยืนยันการลงทะเบียน
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-700/50 text-center text-xs text-slate-400">
                มีบัญชีผู้ใช้งานอยู่แล้ว? 
                <a href="login.html" class="text-blue-400 hover:underline font-semibold ml-1">กลับไปหน้าเข้าสู่ระบบ</a>
            </div>
        </div>
    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            const regAlert = document.getElementById('regAlert');
            const password = document.getElementById('regPassword').value;

            if (password.length < 8) {
                regAlert.className = "p-3 rounded-xl text-xs bg-red-500/10 border border-red-500/20 text-red-400";
                regAlert.textContent = "รหัสผ่านต้องมีความยาวอย่างน้อย 8 ตัวอักษร";
                regAlert.classList.remove('hidden');
                return;
            }

            regAlert.className = "p-3 rounded-xl text-xs bg-emerald-500/10 border border-emerald-500/20 text-emerald-400";
            regAlert.textContent = "ลงทะเบียนสำเร็จ! กำลังพากลับไปหน้าเข้าสู่ระบบ...";
            regAlert.classList.remove('hidden');

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }
    </script>
</body>
</html>
