<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบยืม-คืนอุปกรณ์ไอที</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Decorative Elements -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600 rounded-full blur-3xl opacity-20 pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600 rounded-full blur-3xl opacity-20 pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        
        <!-- Header Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 text-white shadow-lg shadow-blue-500/30 mb-4">
                <i class="fas fa-laptop text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">ระบบยืม-คืนอุปกรณ์ไอที</h1>
            <p class="text-slate-400 text-sm mt-1">สถาบันการศึกษา / มหาวิทยาลัย</p>
        </div>

        <!-- Login Card -->
        <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/50 rounded-3xl p-8 shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-1">เข้าสู่ระบบ</h2>
            <p class="text-slate-400 text-xs mb-6">ใช้อีเมลสถาบันเพื่อเข้าสู่ระบบ (นักศึกษา / เจ้าหน้าที่)</p>

            <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">อีเมลสถาบัน</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required
                            class="w-full pl-11 pr-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
                            placeholder="student@university.ac.th">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">รหัสผ่าน</label>
                        <a href="#" class="text-xs text-blue-400 hover:text-blue-300 transition">ลืมรหัสผ่าน?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="password" required
                            class="w-full pl-11 pr-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Alert Message -->
                <div id="alertBox" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs flex items-center gap-2">
                    <i class="fas fa-exclamation-circle text-sm"></i>
                    <span id="alertText">อีเมลหรือรหัสผ่านไม่ถูกต้อง</span>
                </div>

                <button type="submit" 
                    class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-700/50 text-center text-xs text-slate-400">
                ยังไม่มีบัญชีใช้งาน? 
                <a href="register.html" class="text-blue-400 hover:underline font-semibold ml-1">ลงทะเบียนนักศึกษาใหม่</a>
            </div>
        </div>

        <!-- Footer Notice -->
        <p class="text-center text-xs text-slate-500 mt-8">
            &copy; IT Equipment Borrowing System. Internal Campus Use Only.
        </p>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const alertText = document.getElementById('alertText');

            // ตรวจสอบว่าเป็นอีเมลของสถาบันหรือไม่ (โดเมนจำกัด)
            if (!email.endsWith('@university.ac.th') && !email.endsWith('@mail.kmutt.ac.th') && !email.includes('@')) {
                alertText.textContent = "กรุณาใช้อีเมลสถาบันการศึกษาเท่านั้น";
                alertBox.classList.remove('hidden');
                return;
            }

            try {
                /* 
                // การเชื่อมต่อ Django API จริง
                const response = await fetch('/api/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: email, password: password })
                });
                const data = await response.json();
                */

                // 📌 จำลองระบบตรวจสอบ Role จาก Backend (Mock Data)
                let data = { success: false };

                if (email === 'admin@university.ac.th' && password === 'admin123') {
                    data = { success: true, token: 'jwt-admin-token', is_staff: true };
                } else if (email === 'student@university.ac.th' && password === '123456') {
                    data = { success: true, token: 'jwt-student-token', is_staff: false };
                }

                if (data.success) {
                    localStorage.setItem('userToken', data.token);
                    localStorage.setItem('isStaff', data.is_staff);

                    // 🔀 นำทางไปยังหน้าที่ถูกต้องตามสิทธิ์ (Role-Based Routing)
                    if (data.is_staff) {
                        window.location.href = 'admin_dashboard.html'; // ส่งแอดมินไป Dashboard
                    } else {
                        window.location.href = 'index.html'; // ส่งนักศึกษาไปหน้ายืมอุปกรณ์
                    }
                } else {
                    alertText.textContent = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertText.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์";
                alertBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
